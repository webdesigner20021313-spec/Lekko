# Lekko frontend — nginx config (runtime stage).
#
# Принципы:
#  - SPA fallback: try_files $uri $uri/ /index.html — все клиентские роуты
#    (/profile, /megaprice/orders/123) ловит index.html и React-router рендерит.
#  - /api/* и /hub/* проксируются на бэкенд-gateway (если задан BACKEND_URL).
#    Если не задано — фронт обращается на свой origin, но без proxy уйдёт в 404
#    → задавайте BACKEND_URL в compose-env при single-host деплое.
#  - SignalR /hub — WebSocket upgrade (Connection upgrade, Upgrade header).
#  - gzip + brotli (если установлен) для статики.
#  - hashed assets (vite кладёт hash в имя) — immutable cache.

server {
    listen 80;
    server_name _;
    # Большие headers — нужно для cookie со множеством атрибутов + JWT в браузерах.
    large_client_header_buffers 4 16k;

    root /usr/share/nginx/html;
    index index.html;

    # ── Static cache ────────────────────────────────────────────────────────
    # vite кладёт content-hash в filenames → можно immutable-кэшировать вечно.
    location ~* \.(?:js|css|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # ── Healthcheck ─────────────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ── API proxy → gateway ─────────────────────────────────────────────────
    # Подставляется через envsubst или жёстко через build (см. ARG BACKEND_URL).
    # Дефолт: http://gateway:8080 (docker-compose service name).
    location /api/ {
        proxy_pass         http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # ── SignalR WebSocket proxy ─────────────────────────────────────────────
    location /hub/ {
        proxy_pass         http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        # WebSocket upgrade
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ── SPA fallback ────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    # ── Gzip ────────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain text/css text/javascript text/xml
        application/javascript application/x-javascript application/json
        application/xml application/xml+rss application/font-woff application/font-woff2
        image/svg+xml;
}
